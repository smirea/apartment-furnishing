pre-commit:
  parallel: true
  commands:
    # One command: both fixers rewrite the same staged files, and in parallel one would overwrite the other's edit.
    fix:
      run: >-
        bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
        && bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{js,mjs,mts,ts,tsx,svelte,json,jsonc}'
      run: bun run typecheck
    # Git exports GIT_DIR and GIT_INDEX_FILE to hooks, so a test that runs git in a temp directory would act on this
    # repository unless they are unset first.
    test:
      glob: '*.{js,mjs,mts,ts,tsx}'
      run: unset $(git rev-parse --local-env-vars); bun run test
